<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практика стилизации формы</title>
  <link rel="stylesheet" href="./css/normalase.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <article class="tab">
    <form class="form">
      <fieldset class="first-data">
        <legend class="first-legend">Ваши личные данные</legend>
        <label class="label" for="name">Ваше имя</label>
        <input class="first-data-input" id="name" name="name" placeholder="Имя" required type="text">
        <label class="label" for="age">Ваш возраст</label>
        <input class="first-data-input" id="age" name="age" placeholder="Возраст" required type="number" inputmode="numeric">
        <label class="label" for="tel">Ваш номер телефона</label>
        <input class="first-data-input" id="tel" name="tel" placeholder="Номер телефона" required type="tel" inputmode="tel">
        <label class="label" for="email">Ваша почта</label>
        <input class="first-data-input" id="email" name="email" placeholder="Почта" required type="email" inputmode="email">
      </fieldset>
      <fieldset class="last-feedback-data">
        <label class="label-two" for="feedbeak">Сообщение</label>
        <textarea class="feedback" itemid="feedbeak" name="feedback" placeholder="Ваше обращение" required id="feedback"></textarea>
        <br>
        <input class="checkbox" id="agreement" name="agreement" value="agreement" type="checkbox" required>
        <label class="agreement" for="agreement">Я принимаю <a href="#">правила</a></label>
      </fieldset>
      <br>
      <button class="button" type="submit">Отправить</button>
    </form>
  </article>
</body>

</html>
