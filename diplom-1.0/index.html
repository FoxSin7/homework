<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop.Co</title>
    <link rel="stylesheet" href="./css/index.css" />
    <script defer  src="./js/index.js" type="module"></script>
  </head>

  <body class="page__body">
    <header class="header">
      <div class="header__discount-pop-up">
        <div class="container discount__container">
          <p class="discount__text">
            Зарегестрируйтесь и получите скидку 20% на первую покупку.
          </p>
          <a class="discount__link" href="#">Зарегестрироваться сейчас</a>
          <button class="discount__close-button">
            <svg width="20" height="20">
              <use
                class="discount__cross"
                href="./icons/sprite.svg#cross"
              ></use>
            </svg>
          </button>
        </div>
      </div>
      <div class="header__container container">
        <button class="header__burger burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__menu">
          <svg class="burger__box-icon" width="24" height="24">
            <use
              class="burger__icon-menu"
              href="./icons/sprite.svg#burger-menu"
            ></use>
            <use class="burger__icon-cross" href="./icons/sprite.svg#cross"></use>
          </svg>
        </button>
        <a class="logo header__logo" href="#">SHOP.CO</a>
        <nav class="menu burger__menu header__menu" id="header__menu" aria-label="Главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#shop" class="menu__link"
                >Магазин
                <svg width="16" height="16">
                  <use
                    class="item__arrow--down header__actions-icon"
                    href="./icons/sprite.svg#arrow-down"
                  ></use>
                </svg>
              </a>
            </li>
            <li class="menu__item">
              <a href="#discounts" class="menu__link">Скидки</a>
            </li>
            <li class="menu__item">
              <a href="#new-arrivals" class="menu__link">Новые поступления</a>
            </li>
            <li class="menu__item">
              <a href="#brends" class="menu__link">Бренды</a>
            </li>
          </ul>
        </nav>
        <form role="search" method="get" action="/search" class="search">
          <input
            class="search__input"
            type="search"
            placeholder="Искать товары..."
          />
          <svg class="search__icon" width="24" height="24">
            <use
              class="header__actions-icon"
              href="./icons/sprite.svg#search"
            ></use>
          </svg>
        </form>

        <div class="header__controls">
          <a class="control__buttons search__icon--button" href="#">
            <svg class="" width="24" height="24">
              <use
                class="header__actions-icon"
                href="./icons/sprite.svg#search"
              ></use>
            </svg>
          </a>
          <a class="control__buttons controls__basket-link" href="#">
            <svg width="24" height="24">
              <use
                class="header__actions-icon"
                href="./icons/sprite.svg#basket"
              ></use>
            </svg>
          </a>
          <a class="control__buttons controls__profile-link" href="#">
            <svg width="24" height="24">
              <use
                class="header__actions-icon"
                href="./icons/sprite.svg#profile"
              ></use>
            </svg>
          </a>
        </div>
      </div>
    </header>
  </body>
</html>
